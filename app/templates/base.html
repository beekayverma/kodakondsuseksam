<!doctype html>
<html lang="et">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0d1116" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f6f8fa" media="(prefers-color-scheme: light)">
  <meta name="description" content="Free study tool for the Estonian citizenship exam. Estonian questions, hints in your language, real exam format.">
  <link rel="manifest" href="/static/manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="/static/icon-192.png">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <link rel="stylesheet" href="/static/style.css">
  <title>{% block title %}kodakondsuseksam{% endblock %}</title>
</head>
<body>
  <a class="skip-link" href="#main">Sisu juurde (Skip to content)</a>

  <header class="topnav" role="banner">
    <div class="topnav-inner">
      <a class="brand" href="/" aria-label="kodakondsuseksam, avaleht">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 6h16M4 12h16M4 18h10"/>
          </svg>
        </span>
        <span class="brand-text">kodakondsuseksam</span>
      </a>
      <nav class="topnav-links" aria-label="Peamenüü (Main menu)">
        <a href="/">Avaleht <span class="nav-sub">(Home)</span></a>
        <a href="/opi">Õpi <span class="nav-sub">(Learn)</span></a>
        <a href="/eksam">Eksam <span class="nav-sub">(Exam)</span></a>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Vaheta teemat (Toggle theme)">
          <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
      </nav>
    </div>
  </header>

  <main id="main" role="main">
    {% block content %}{% endblock %}
  </main>

  <footer role="contentinfo">
    <div class="footer-inner">
      <p>
        Vaba ja avatud lähtekoodiga. (Free and open-source.)
        Kood AGPL-3.0, sisu CC BY-SA 4.0.
      </p>
      <p>
        <a href="https://github.com/beekayverma/kodakondsuseksam" rel="noopener noreferrer">
          Lähtekood GitHubis (Source on GitHub)
        </a>
      </p>
    </div>
  </footer>

  <script type="module" src="/static/app.js"></script>
</body>
</html>
